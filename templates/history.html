<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>EcoTracker - Cronologia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <h2>📜 Cronologia Test per {{ email }}</h2>

        {% if storico %}
        <table>
            <tr>
                <th>Test #</th>
                <th>CO₂ Totale</th>
                <th>Maggior Consumo</th>
            </tr>
            {% for test in storico %}
            <tr>
                <td>{{ test.id }}</td>
                <td>{{ test.co2_totale }} kg</td>
                <td>{{ test.maggior_impatto }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>Non hai ancora effettuato nessun test.</p>
        {% endif %}

        <br>
        <a href="/index" class="link-btn">← Torna al Questionario</a> | 
        <a href="/logout" class="link-btn logout-btn">Disconnettiti</a>
    </div>
</body>
</html>
